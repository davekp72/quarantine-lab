#!/usr/sbin/nft -f
# FakeNet sinkhole: no LAN→WAN internet. FakeNet listeners on the gateway.
# Placeholders __WAN__ __LAN__ __LAN_CIDR__ __LAN_IP__ __GUEST_IP__ __AGENT_PORT__
# substituted by set-traffic-mode.sh / first-boot.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    icmp type echo-request accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-router-advert } accept
    # SSH from host only (VirtualBox NAT port-forward lands on WAN).
    iifname "__WAN__" tcp dport 22 accept
    # FakeNet listeners (lab guest → gateway)
    iifname "__LAN__" udp dport { 53, 1337 } accept
    iifname "__LAN__" tcp dport { 53, 80, 443, 25, 1337 } accept
    # PAC/explicit leftover (harmless if mitm is stopped)
    iifname "__LAN__" tcp dport { 8080, 8081, 8082 } accept
    iifname "__LAN__" udp dport { 67, 68 } accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    # Host agent via WAN NAT PF → lab guest on LAN
    iifname "__WAN__" oifname "__LAN__" tcp dport __AGENT_PORT__ ip daddr __GUEST_IP__ accept
    # No LAN→WAN in FakeNet mode (sinkhole). FakeNet NFQUEUE handles guest packets
    # destined to public IPs before they would forward.
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority -100; policy accept;
    iifname "__WAN__" tcp dport __AGENT_PORT__ dnat to __GUEST_IP__:__AGENT_PORT__
    # Do NOT redirect :80/:443 — FakeNet HTTP listeners bind those ports.
  }

  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    oifname "__WAN__" ip saddr __LAN_CIDR__ masquerade
    oifname "__LAN__" ip daddr __GUEST_IP__ tcp dport __AGENT_PORT__ snat to __LAN_IP__
  }
}
