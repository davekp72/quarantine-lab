#!/usr/sbin/nft -f
# Quarantine Gateway firewall / NAT / transparent MITM redirect
# Placeholders __WAN__ __LAN__ __LAN_CIDR__ substituted by first-boot.sh

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    icmp type echo-request accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-router-advert } accept
    # SSH from host (VirtualBox NAT port-forward lands on WAN)
    iifname "__WAN__" tcp dport 22 accept
    # SSH / status from LAN
    iifname "__LAN__" tcp dport { 22, 8080, 8081, 8082 } accept
    iifname "__LAN__" udp dport 53 accept
    iifname "__LAN__" tcp dport 53 accept
    # DHCP if used
    iifname "__LAN__" udp dport { 67, 68 } accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    # Host agent via WAN NAT PF → lab guest on LAN
    iifname "__WAN__" oifname "__LAN__" tcp dport __AGENT_PORT__ ip daddr __GUEST_IP__ accept
    # LAN -> WAN
    iifname "__LAN__" oifname "__WAN__" accept
    # Block LAN hosts from talking to RFC1918 via WAN (defense in depth)
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority -100; policy accept;
    # Host → lab agent (do not MITM this port)
    iifname "__WAN__" tcp dport __AGENT_PORT__ dnat to __GUEST_IP__:__AGENT_PORT__
    # Transparent MITM: redirect guest HTTPS/HTTP to local mitmproxy
    iifname "__LAN__" tcp dport 443 redirect to :8082
    iifname "__LAN__" tcp dport 80 redirect to :8082
  }

  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    # Masquerade LAN traffic out WAN
    oifname "__WAN__" ip saddr __LAN_CIDR__ masquerade
    # Agent DNAT: guest sees the LAN gateway as source (return path + Windows firewall)
    oifname "__LAN__" ip daddr __GUEST_IP__ tcp dport __AGENT_PORT__ snat to __LAN_IP__
  }
}
