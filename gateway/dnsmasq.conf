# Template / fallback — first-boot.sh generates /etc/dnsmasq.d/quarantine-gateway.conf
# with the detected LAN interface and address. Kept for reference / manual installs.
interface=enp0s8
bind-interfaces
except-interface=lo
except-interface=enp0s3
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
listen-address=10.66.0.1
dhcp-range=10.66.0.50,10.66.0.200,12h
dhcp-option=option:router,10.66.0.1
dhcp-option=option:dns-server,10.66.0.1
dhcp-host=lab-guest,10.66.0.15
log-queries
log-facility=/var/log/quarantine/dnsmasq.log
