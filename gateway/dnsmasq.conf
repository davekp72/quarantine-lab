# Quarantine Gateway DNS (and optional DHCP) for lab segment
# Interfaces are matched by name if present; listen-address is authoritative.
interface=enp0s8
interface=eth1
bind-interfaces
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
listen-address=10.66.0.1
# Optional DHCP for lab guests (static preferred via Configure-QuarantineGuestNetwork.ps1 -Mode gateway)
dhcp-range=10.66.0.50,10.66.0.200,12h
dhcp-option=option:router,10.66.0.1
dhcp-option=option:dns-server,10.66.0.1
dhcp-host=lab-guest,10.66.0.15
log-queries
log-facility=/var/log/quarantine/dnsmasq.log
