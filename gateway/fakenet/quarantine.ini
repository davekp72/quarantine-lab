###############################################################################
# Quarantine lab FakeNet-NG (MultiHost sinkhole on the LAN).
# Placeholders __LAN__ and __LAN_IP__ are substituted by set-traffic-mode.sh.
#
# LinuxFlushIptables MUST stay No — flushing iptables-nft would wipe our
# nftables (WAN SSH, agent DNAT, RFC1918 drop).
###############################################################################

[FakeNet]
DivertTraffic: Yes

###############################################################################
# Diverter

[Diverter]
NetworkMode: MultiHost
LinuxRedirectNonlocal: __LAN__
LinuxRestrictInterface: __LAN__
LinuxFlushIptables: No
LinuxFlushDNSCommand:

DumpPackets: No
DumpPacketsFilePrefix: packets

ModifyLocalDNS: No
StopDNSService: No

RedirectAllTraffic: Yes
DefaultTCPListener: RawTCPListener
DefaultUDPListener: RawUDPListener

# Do not divert DHCP/mDNS/etc.
BlackListPortsTCP: 139
BlackListPortsUDP: 67, 68, 137, 138, 1900, 5355

###############################################################################
# Listeners
# Lab guest DNS is 10.66.0.1 — FakeNet must bind UDP/TCP 53 on the LAN IP.
# Current FakeNet-NG uses ResponseA (not the older DNSResponse key).

[DNS Server]
Enabled: True
Port: 53
Protocol: UDP
Listener: DNSListener
ResponseA: __LAN_IP__
ResponseMX: mail.fakenet.local
ResponseTXT: FAKENET
NXDomains: 0
Hidden: False

[DNS Server TCP]
Enabled: True
Port: 53
Protocol: TCP
Listener: DNSListener
ResponseA: __LAN_IP__
ResponseMX: mail.fakenet.local
ResponseTXT: FAKENET
NXDomains: 0
Hidden: False

[HTTPListener80]
Enabled: True
Port: 80
Protocol: TCP
Listener: HTTPListener
UseSSL: No
Webroot: /var/log/quarantine/fakenet/www
Timeout: 10
Hidden: False

# Sign FakeNet HTTPS with the lab mitmproxy CA (same cert permissive MITM uses).
# Paths are prepared by set-traffic-mode from /root/.mitmproxy/mitmproxy-ca.pem.
# Guest: http://10.66.0.1/mitmproxy-ca-cert.cer then Import into Trusted Root.
[HTTPListener443]
Enabled: True
Port: 443
Protocol: TCP
Listener: HTTPListener
UseSSL: Yes
Webroot: /var/log/quarantine/fakenet/www
Static_CA: Yes
CA_Cert: /etc/quarantine-gateway/fakenet-ca-cert.pem
CA_Key: /etc/quarantine-gateway/fakenet-ca-key.pem
NetworkMode: MultiHost
Cert_Dir: /var/log/quarantine/fakenet/certs
Timeout: 10
Hidden: False

[SMTPListener]
Enabled: True
Port: 25
Protocol: TCP
Listener: SMTPListener
Hidden: False

[RawTCPListener]
Enabled: True
Port: 1337
Protocol: TCP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False

[RawUDPListener]
Enabled: True
Port: 1337
Protocol: UDP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False
