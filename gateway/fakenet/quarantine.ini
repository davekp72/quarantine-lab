###############################################################################
# Quarantine lab FakeNet-NG (MultiHost sinkhole on the LAN).
# Placeholders __LAN__ and __LAN_IP__ are substituted by set-traffic-mode.sh.
#
# LinuxFlushIptables MUST stay No — flushing iptables-nft would wipe our
# nftables (WAN SSH, agent DNAT, RFC1918 drop).
###############################################################################

[FakeNet]
DivertTraffic: Yes

###############################################################################
# Diverter

[Diverter]
NetworkMode: MultiHost
LinuxRedirectNonlocal: __LAN__
LinuxRestrictInterface: __LAN__
LinuxFlushIptables: No
LinuxFlushDNSCommand:

DumpPackets: No
DumpPacketsFilePrefix: packets

ModifyLocalDNS: No
StopDNSService: No

RedirectAllTraffic: Yes
DefaultTCPListener: RawTCPListener
DefaultUDPListener: RawUDPListener

###############################################################################
# Listeners
# DNS answers the gateway LAN IP so follow-on TCP/UDP hits services we bind.

[DNS Server]
Enabled: True
Port: 53
Protocol: UDP
Listener: DNSListener
DNSResponse: __LAN_IP__
NXDomains: 0
Hidden: False

[DNS Server TCP]
Enabled: True
Port: 53
Protocol: TCP
Listener: DNSListener
DNSResponse: __LAN_IP__
NXDomains: 0
Hidden: False

[HTTPListener80]
Enabled: True
Port: 80
Protocol: TCP
Listener: HTTPListener
UseSSL: No
Hidden: False

[HTTPListener443]
Enabled: True
Port: 443
Protocol: TCP
Listener: HTTPListener
UseSSL: Yes
Hidden: False

[SMTPListener]
Enabled: True
Port: 25
Protocol: TCP
Listener: SMTPListener
Hidden: False

[RawTCPListener]
Enabled: True
Port: 1337
Protocol: TCP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False

[RawUDPListener]
Enabled: True
Port: 1337
Protocol: UDP
Listener: RawListener
UseSSL: No
Timeout: 10
Hidden: False
